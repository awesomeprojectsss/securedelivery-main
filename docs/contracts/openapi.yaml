openapi: 3.1.0
info:
  title: SecureDelivery API
  version: 1.4.0
  license:
    name: GNU General Public License v3.0
    identifier: GPL-3.0-only
  description: Canonical HTTP contract for SecureDelivery. Device is the technical domain term; SmartBox is a product-facing
    UI label. Telemetry schemaVersion 4 uses lean one-minute summaries, explicit navigation quality and stable period IDs. Device-event
    schemaVersion 2 carries event-specific high-frequency evidence. Version 1.4 adds governance, persistent pending-Device
    activation codes and per-period telemetry acknowledgement.
servers:
- url: /api/v1
security:
- UserBearerAuth: []
tags:
- name: Auth
  description: Human authentication and session lifecycle.
- name: Users
  description: Human users and RBAC-governed account operations.
- name: Customers
  description: Customer tenant resources.
- name: Devices
  description: Technical Device resources, activation and credential provisioning.
- name: Monitoring
  description: Device-authenticated MonitoringSession synchronization.
- name: Telemetry
  description: Device-authenticated lean telemetry ingestion.
- name: Events
  description: Device event ingestion and authorized event queries.
- name: Tickets
  description: Persistent support tickets and messages.
- name: DeviceRequests
  description: Customer Device requests displayed as SmartBox Requests.
- name: Notifications
  description: Persistent human notifications and read state.
paths:
  /auth/login:
    post:
      security: []
      tags:
      - Auth
      operationId: login
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      security: []
      tags:
      - Auth
      operationId: refreshSession
      summary: Refresh an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: End the current session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      tags:
      - Users
      operationId: getCurrentUser
      summary: Get current user profile
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags:
      - Users
      operationId: updateCurrentUser
      summary: Update current user profile/preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                theme:
                  $ref: '#/components/schemas/Theme'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/me/change-password:
    post:
      tags:
      - Users
      operationId: changeOwnPassword
      summary: Change current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: Password changed
  /users:
    get:
      tags:
      - Users
      operationId: listUsers
      summary: List users according to RBAC
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
    post:
      tags:
      - Users
      operationId: createUser
      summary: Create a user according to RBAC
      description: SUPER_ADMIN creates privileged ADMIN/SUPER_ADMIN accounts. ADMIN may create CUSTOMER users. Email is globally unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{userId}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    get:
      tags:
      - Users
      operationId: getUser
      summary: Get one user according to RBAC
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags:
      - Users
      operationId: updateUser
      summary: Update one user according to RBAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{userId}/activate:
    parameters:
    - $ref: '#/components/parameters/UserId'
    post:
      tags:
      - Users
      operationId: activateUser
      summary: Activate a user according to RBAC
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: User activated
  /users/{userId}/deactivate:
    parameters:
    - $ref: '#/components/parameters/UserId'
    post:
      tags:
      - Users
      operationId: deactivateUser
      summary: Deactivate a user according to RBAC restrictions
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: User deactivated
  /users/{userId}/reset-password:
    parameters:
    - $ref: '#/components/parameters/UserId'
    post:
      tags:
      - Users
      operationId: resetUserPassword
      summary: Reset an allowed user's password
      description: Sets a temporary password, revokes all sessions for the affected user and requires password change before normal protected use. Only SUPER_ADMIN may reset a privileged account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: Password reset initiated/completed according to policy
  /users/{userId}/change-role:
    parameters:
    - $ref: '#/components/parameters/UserId'
    post:
      tags:
      - Users
      operationId: changeUserRole
      summary: Change an allowed user's role
      description: SUPER_ADMIN only. The operation must not demote or otherwise eliminate the last active SUPER_ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: User role changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /customers:
    get:
      tags:
      - Customers
      operationId: listCustomers
      summary: List Customers according to RBAC
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomers'
    post:
      tags:
      - Customers
      operationId: createCustomer
      summary: Create a Customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
  /customers/{customerId}:
    parameters:
    - $ref: '#/components/parameters/CustomerId'
    get:
      tags:
      - Customers
      operationId: getCustomer
      summary: Get one authorized Customer
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
    patch:
      tags:
      - Customers
      operationId: updateCustomer
      summary: Update one authorized Customer
      description: Setting status to INACTIVE blocks Customer-user authentication and access, revokes their sessions, and rejects new Device monitoring/telemetry/event writes while preserving history and administrator access to pending requests and tickets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
  /devices:
    get:
      tags:
      - Devices
      operationId: listDevices
      summary: List Devices (displayed as SmartBoxes in product UI)
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: customerId
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/DeviceStatus'
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDevices'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Devices
      operationId: createDevice
      summary: Create a Device
      description: ADMIN or SUPER_ADMIN creates the Device directly in PENDING_ACTIVATION. The MVP has no CREATED status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Device created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /devices/{deviceId}:
    parameters:
    - $ref: '#/components/parameters/DeviceId'
    get:
      tags:
      - Devices
      operationId: getDevice
      summary: Get one authorized Device
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
    patch:
      tags:
      - Devices
      operationId: updateDevice
      summary: Update one Device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Device updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
    delete:
      tags:
      - Devices
      operationId: removeDevice
      summary: Remove a Device from active operation while preserving required history
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: Device removed/deactivated according to retention policy
  /device-activations/validate:
    post:
      security: []
      tags:
      - Devices
      operationId: validateDeviceActivation
      summary: Validate a persistent pending-Device activation code
      description: The high-entropy code has no time-based expiration while the Device is PENDING_ACTIVATION and may be validated repeatedly. Attempts are rate-limited. An activated Device returns ALREADY_ACTIVATED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceActivationTokenRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Activation information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActivation'
  /device-activations/confirm:
    post:
      tags:
      - Devices
      operationId: confirmDeviceActivation
      summary: Confirm activation as an authenticated Customer
      description: The first successful confirmation atomically associates the Device and makes it ACTIVE. Later attempts return a conflict and never transfer ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceActivationTokenRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Activated Device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /device-credentials/exchange:
    post:
      security: []
      tags:
      - Devices
      operationId: provisionDeviceCredential
      summary: Exchange confirmed activation material once for a Device credential
      description: The persistent activation code is sent only in the JSON body for this one-time post-confirmation exchange. It is not a human or Device bearer credential and must never appear in paths, query strings or logs. The MVP Device credential has no time-based expiration and remains valid until explicit revocation, Device inactivation/removal or Customer inactivation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceActivationTokenRequest'
      responses:
        '200':
          description: One-time Device credential provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCredentialProvisioning'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /devices/{deviceId}/monitoring-sessions:
    post:
      security:
      - DeviceBearerAuth: []
      tags:
      - Monitoring
      operationId: startMonitoringSession
      summary: Idempotently create or reconcile a Device-generated MonitoringSession
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMonitoringSessionRequest'
      responses:
        '200':
          description: Existing MonitoringSession reconciled idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringSession'
        '201':
          description: Monitoring session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /devices/{deviceId}/monitoring-sessions/{monitoringSessionId}/stop:
    post:
      security:
      - DeviceBearerAuth: []
      tags:
      - Monitoring
      operationId: stopMonitoringSession
      summary: Idempotently stop a MonitoringSession at the Device-observed time
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/MonitoringSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopMonitoringSessionRequest'
      responses:
        '200':
          description: Monitoring session stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /devices/{deviceId}/telemetry/batches:
    post:
      security:
      - DeviceBearerAuth: []
      tags:
      - Telemetry
      operationId: ingestTelemetryBatch
      summary: Ingest idempotent compact telemetry period summaries
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryBatch'
      responses:
        '202':
          description: Valid batch envelope processed with an acknowledgement for every telemetry period; individual items may be rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryBatchAcknowledgement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      description: Normal telemetry contains compact period summaries rather than continuous raw IMU samples. Offline
        Devices may send multiple pending periods in one idempotent batch. A malformed envelope fails as a whole; otherwise
        every period receives an independent result and one rejected item does not prevent valid siblings from being accepted.
  /devices/{deviceId}/events:
    post:
      security:
      - DeviceBearerAuth: []
      tags:
      - Events
      operationId: ingestDeviceEvent
      summary: Ingest an idempotent extensible Device-generated event
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEvent'
      responses:
        '202':
          description: Event accepted or previously accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionAcknowledgement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      description: Ingest an extensible Device-generated event with required high-frequency evidence and optional reliable speed/navigation context.
  /events:
    get:
      tags:
      - Events
      operationId: listEvents
      summary: List authorized Device events
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: deviceId
        in: query
        schema:
          type: string
          format: uuid
      - name: customerId
        in: query
        schema:
          type: string
          format: uuid
      - name: eventType
        in: query
        schema:
          type: string
      - name: severity
        in: query
        schema:
          $ref: '#/components/schemas/EventSeverity'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvents'
  /events/{eventId}:
    get:
      tags:
      - Events
      operationId: getEvent
      summary: Get one authorized Device event
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEvent'
  /tickets:
    get:
      tags:
      - Tickets
      operationId: listTickets
      summary: List authorized support tickets
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'
    post:
      tags:
      - Tickets
      operationId: createTicket
      summary: Create a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
  /tickets/{ticketId}:
    get:
      tags:
      - Tickets
      operationId: getTicket
      summary: Get one authorized support ticket
      parameters:
      - $ref: '#/components/parameters/TicketId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
  /tickets/{ticketId}/messages:
    get:
      tags:
      - Tickets
      operationId: listTicketMessages
      summary: List authoritative persisted ticket message history
      parameters:
      - $ref: '#/components/parameters/TicketId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Paginated ticket messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTicketMessages'
    post:
      tags:
      - Tickets
      operationId: createTicketMessage
      summary: Persist a support ticket message
      parameters:
      - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketMessageRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Message persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketMessage'
  /tickets/{ticketId}/assign:
    post:
      tags:
      - Tickets
      operationId: assignTicket
      summary: Assign a support ticket to an Administrator
      parameters:
      - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTicketRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Ticket assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
  /tickets/{ticketId}/resolve:
    post:
      tags:
      - Tickets
      operationId: resolveTicket
      summary: Resolve a support ticket
      parameters:
      - $ref: '#/components/parameters/TicketId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Ticket resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
  /tickets/{ticketId}/close:
    post:
      tags:
      - Tickets
      operationId: closeTicket
      summary: Close a resolved or otherwise closeable ticket according to policy
      parameters:
      - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          $ref: '#/components/responses/Conflict'
  /device-requests:
    get:
      tags:
      - DeviceRequests
      operationId: listDeviceRequests
      summary: List DeviceRequests visible under RBAC and tenant isolation
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Device requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeviceRequests'
    post:
      tags:
      - DeviceRequests
      operationId: createDeviceRequest
      summary: Submit a Customer Device request (SmartBox Request in UI)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitDeviceRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Device request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRequest'
  /device-requests/{requestId}:
    get:
      tags:
      - DeviceRequests
      operationId: getDeviceRequest
      summary: Get one authorized DeviceRequest
      parameters:
      - $ref: '#/components/parameters/DeviceRequestId'
      responses:
        '200':
          description: Device request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /device-requests/{requestId}/fulfill:
    post:
      tags:
      - DeviceRequests
      operationId: fulfillDeviceRequest
      summary: Fulfill a pending DeviceRequest by associating the supplied Device
      description: ADMIN or SUPER_ADMIN only. The request must be PENDING and the Device must be PENDING_ACTIVATION, unassigned and not removed. Fulfillment atomically associates it with the requesting Customer and remains auditable.
      parameters:
      - $ref: '#/components/parameters/DeviceRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FulfillDeviceRequest'
      responses:
        '200':
          description: Device request fulfilled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /device-requests/{requestId}/cancel:
    post:
      tags:
      - DeviceRequests
      operationId: cancelDeviceRequest
      summary: Cancel a pending DeviceRequest with an auditable reason
      description: A Customer may cancel its own pending request. ADMIN or SUPER_ADMIN may cancel an authorized pending request. Terminal requests cannot be cancelled again.
      parameters:
      - $ref: '#/components/parameters/DeviceRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDeviceRequest'
      responses:
        '200':
          description: Device request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /notifications:
    get:
      tags:
      - Notifications
      operationId: listNotifications
      summary: List authoritative notifications for the current user
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: read
        in: query
        schema:
          type: boolean
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotifications'
  /notifications/{notificationId}/read:
    patch:
      tags:
      - Notifications
      operationId: markNotificationRead
      summary: Mark one authorized notification as read
      parameters:
      - $ref: '#/components/parameters/NotificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkNotificationReadRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
components:
  securitySchemes:
    UserBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Human user access token. Authorization remains subject to RBAC and Customer ownership.
    DeviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-or-JWT
      description: Credential representing exactly one Device; the path deviceId must match the authenticated Device.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MonitoringSessionId:
      name: monitoringSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Device-generated canonical MonitoringSession UUID.
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated identity is not authorized for this resource or tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not visible to the authenticated identity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current resource state or idempotency semantics
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    UserRole:
      type: string
      enum:
      - SUPER_ADMIN
      - ADMIN
      - CUSTOMER
    Theme:
      type: string
      enum:
      - LIGHT
      - DARK
      - SYSTEM
    DeviceStatus:
      type: string
      enum:
      - PENDING_ACTIVATION
      - ACTIVE
      - INACTIVE
    DeviceHealth:
      type: string
      enum:
      - HEALTHY
      - WARNING
      - CRITICAL
      - UNKNOWN
    ConnectivityStatus:
      type: string
      enum:
      - ONLINE
      - OFFLINE
      - UNKNOWN
    MonitoringStatus:
      type: string
      enum:
      - MONITORING
      - STOPPED
      - UNKNOWN
    EventSeverity:
      type: string
      enum:
      - INFO
      - WARNING
      - CRITICAL
    IngestionStatus:
      type: string
      enum:
      - ACCEPTED
      - ALREADY_ACCEPTED
      - REJECTED
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: Opaque refresh credential stored securely by the client.
    LogoutRequest:
      type: object
      additionalProperties: false
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: Refresh credential to revoke/end.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 12
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - newPassword
      properties:
        newPassword:
          type: string
          minLength: 12
          description: New password delivered to the affected user according to operational policy; never logged.
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      - role
      - password
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          description: Globally unique across the platform.
        role:
          $ref: '#/components/schemas/UserRole'
        password:
          type: string
          minLength: 12
        customerId:
          type:
          - string
          - 'null'
          format: uuid
          description: Required for CUSTOMER and null for platform-wide ADMIN/SUPER_ADMIN identities.
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
    AuthSession:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Explicit refresh credential; clients must store it securely and send it to refresh/logout operations.
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required:
      - id
      - name
      - email
      - role
      - status
      - mustChangePassword
      - customerId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          description: Globally unique across the platform.
        role:
          $ref: '#/components/schemas/UserRole'
        customerId:
          type:
          - string
          - 'null'
          format: uuid
          description: Owning tenant for CUSTOMER; null for platform-wide ADMIN and SUPER_ADMIN.
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        mustChangePassword:
          type: boolean
          description: True after administrative reset until the user successfully changes the temporary password.
        theme:
          $ref: '#/components/schemas/Theme'
    Customer:
      type: object
      required:
      - id
      - name
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
    UpdateCustomerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          minimum: 0
        recordedAt:
          type: string
          format: date-time
    BatteryState:
      type: object
      required:
      - levelPercent
      - charging
      properties:
        levelPercent:
          type: number
          minimum: 0
          maximum: 100
        charging:
          type: boolean
    ConnectivityState:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/ConnectivityStatus'
        type:
          type: string
          description: Extensible connection type such as CELLULAR, WIFI or UNKNOWN.
    DeviceState:
      type: object
      additionalProperties: false
      required:
      - battery
      - connectivity
      - monitoringStatus
      properties:
        battery:
          $ref: '#/components/schemas/BatteryState'
        connectivity:
          $ref: '#/components/schemas/ConnectivityState'
        monitoringStatus:
          $ref: '#/components/schemas/MonitoringStatus'
    Device:
      type: object
      required:
      - id
      - code
      - displayName
      - status
      - health
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        displayName:
          type: string
          description: Product-facing name; the UI may label the Device as a SmartBox.
        customerId:
          type:
          - string
          - 'null'
          format: uuid
        status:
          $ref: '#/components/schemas/DeviceStatus'
        health:
          $ref: '#/components/schemas/DeviceHealth'
        monitoringStatus:
          $ref: '#/components/schemas/MonitoringStatus'
        battery:
          $ref: '#/components/schemas/BatteryState'
        connectivity:
          $ref: '#/components/schemas/ConnectivityState'
        lastSeenAt:
          type:
          - string
          - 'null'
          format: date-time
        lastLocation:
          anyOf:
          - $ref: '#/components/schemas/Location'
          - type: 'null'
    CreateDeviceRequest:
      type: object
      additionalProperties: false
      required:
      - displayName
      properties:
        displayName:
          type: string
          minLength: 1
    UpdateDeviceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/DeviceStatus'
    DeviceActivation:
      type: object
      required:
      - deviceId
      - status
      properties:
        deviceId:
          type: string
          format: uuid
        deviceCode:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum:
          - VALID
          - ALREADY_ACTIVATED
          - INVALID
    DeviceActivationTokenRequest:
      type: object
      additionalProperties: false
      required:
      - activationToken
      properties:
        activationToken:
          type: string
          minLength: 32
          writeOnly: true
          description: Persistent high-entropy bootstrap code while the Device is PENDING_ACTIVATION. It is not a bearer credential. Accept only in a JSON request body; rate-limit attempts and redact from logs, traces and error reports.
    DeviceCredentialProvisioning:
      type: object
      additionalProperties: false
      required:
      - deviceId
      - accessToken
      - tokenType
      properties:
        deviceId:
          type: string
          format: uuid
        accessToken:
          type: string
          description: One-time returned Device bearer credential; store securely and never log.
        tokenType:
          type: string
          const: Bearer
    StartMonitoringSessionRequest:
      type: object
      additionalProperties: false
      required:
      - monitoringSessionId
      - startedAt
      properties:
        monitoringSessionId:
          type: string
          format: uuid
          description: Device-generated canonical session UUID reused for every retry and dependent record.
        startedAt:
          type: string
          format: date-time
    MonitoringSession:
      type: object
      required:
      - monitoringSessionId
      - deviceId
      - status
      - startedAt
      properties:
        monitoringSessionId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACTIVE
          - STOPPED
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        receivedAt:
          type: string
          format: date-time
          readOnly: true
    StopMonitoringSessionRequest:
      type: object
      additionalProperties: false
      required:
      - finishedAt
      properties:
        finishedAt:
          type: string
          format: date-time
          description: Actual Device-observed UTC stop time, never inferred from server receipt time.
    Observation:
      type: object
      required:
      - key
      - value
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)+$
        value:
          oneOf:
          - type: number
          - type: string
          - type: boolean
        unit:
          type: string
    NavigationSummary:
      type: object
      additionalProperties: false
      required:
      - status
      - source
      - distanceTraveledMeters
      - movingDurationSeconds
      - stoppedDurationSeconds
      - maximumSpeedMetersPerSecond
      properties:
        status:
          type: string
          enum:
          - VALID
          - PARTIAL
          - UNAVAILABLE
          description: Whether all, some or none of the navigation KPI inputs are reliable for this period.
        source:
          type: string
          enum:
          - GNSS
          - GPS_DERIVED
          - UNAVAILABLE
          description: Best source used for the reported navigation metrics.
        distanceTraveledMeters:
          type:
          - number
          - 'null'
          minimum: 0
          description: Reliable distance in meters during this period, or null when unavailable.
        movingDurationSeconds:
          type:
          - number
          - 'null'
          minimum: 0
          description: Reliable moving duration in seconds during this period, or null when unavailable.
        stoppedDurationSeconds:
          type:
          - number
          - 'null'
          minimum: 0
          description: Reliable stopped duration in seconds during this period, or null when unavailable.
        maximumSpeedMetersPerSecond:
          type:
          - number
          - 'null'
          minimum: 0
          description: Maximum reliable ground speed in meters per second during this period, or null when unavailable.
      oneOf:
      - title: Valid navigation
        required:
        - status
        - source
        - distanceTraveledMeters
        - movingDurationSeconds
        - stoppedDurationSeconds
        - maximumSpeedMetersPerSecond
        properties:
          status:
            const: VALID
          source:
            enum:
            - GNSS
            - GPS_DERIVED
          distanceTraveledMeters:
            type: number
          movingDurationSeconds:
            type: number
          stoppedDurationSeconds:
            type: number
          maximumSpeedMetersPerSecond:
            type: number
      - title: Partial navigation
        required:
        - status
        - source
        - distanceTraveledMeters
        - movingDurationSeconds
        - stoppedDurationSeconds
        - maximumSpeedMetersPerSecond
        properties:
          status:
            const: PARTIAL
          source:
            enum:
            - GNSS
            - GPS_DERIVED
        anyOf:
        - properties:
            distanceTraveledMeters:
              type: number
        - properties:
            movingDurationSeconds:
              type: number
        - properties:
            stoppedDurationSeconds:
              type: number
        - properties:
            maximumSpeedMetersPerSecond:
              type: number
      - title: Unavailable navigation
        required:
        - status
        - source
        - distanceTraveledMeters
        - movingDurationSeconds
        - stoppedDurationSeconds
        - maximumSpeedMetersPerSecond
        properties:
          status:
            const: UNAVAILABLE
          source:
            const: UNAVAILABLE
          distanceTraveledMeters:
            type: 'null'
          movingDurationSeconds:
            type: 'null'
          stoppedDurationSeconds:
            type: 'null'
          maximumSpeedMetersPerSecond:
            type: 'null'
    TelemetryBatch:
      type: object
      required:
      - schemaVersion
      - batchId
      - monitoringSessionId
      - periods
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 4
          description: Current lean telemetry envelope schema version with explicit navigation quality, stable period IDs and per-period acknowledgement.
        batchId:
          type: string
          format: uuid
        monitoringSessionId:
          type: string
          format: uuid
        periods:
          type: array
          minItems: 1
          maxItems: 1440
          items:
            $ref: '#/components/schemas/TelemetryPeriodSummary'
    Detector:
      type: object
      required:
      - name
      - version
      properties:
        name:
          type: string
        version:
          type: string
    EventEvidence:
      type: object
      required:
      - startedAt
      - finishedAt
      - samples
      additionalProperties: false
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        samples:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EvidenceSample'
          description: High-frequency event-specific evidence samples.
    DeviceEvent:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - eventId
      - monitoringSessionId
      - eventType
      - severity
      - occurredAt
      - detector
      - attributes
      - evidence
      - location
      - deviceId
      - receivedAt
      properties:
        schemaVersion:
          type: integer
          const: 2
          description: Current Device event envelope schema version.
        eventId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
          readOnly: true
        monitoringSessionId:
          type: string
          format: uuid
        eventType:
          type: string
          description: Open namespaced Device-generated event type.
          pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)+$
        severity:
          $ref: '#/components/schemas/EventSeverity'
        occurredAt:
          type: string
          format: date-time
        location:
          anyOf:
          - $ref: '#/components/schemas/Location'
          - type: 'null'
          description: Nullable when the Device has no reliable GPS fix.
        detector:
          $ref: '#/components/schemas/Detector'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
          description: Generic event attributes. Motion events should include reliable navigation context when available,
            such as navigation.speed.at_event, navigation.speed.average_5s_before, navigation.speed.maximum_10s_before
            and navigation.moving.
        evidence:
          $ref: '#/components/schemas/EventEvidence'
        receivedAt:
          type: string
          format: date-time
          readOnly: true
          description: Server ingestion timestamp, distinct from occurredAt.
    IngestionAcknowledgement:
      type: object
      required:
      - id
      - status
      - receivedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/IngestionStatus'
        receivedAt:
          type: string
          format: date-time
    TelemetryPeriodIngestionResult:
      type: object
      additionalProperties: false
      required:
      - periodId
      - status
      properties:
        periodId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/IngestionStatus'
        code:
          type: string
          description: Stable machine-readable reason when status is REJECTED.
        message:
          type: string
          description: Human-readable diagnostic when status is REJECTED; clients branch on code, not this value.
    TelemetryBatchAcknowledgement:
      type: object
      additionalProperties: false
      required:
      - batchId
      - receivedAt
      - items
      properties:
        batchId:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TelemetryPeriodIngestionResult'
    CreateTicketRequest:
      type: object
      additionalProperties: false
      required:
      - subject
      - message
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 10000
    CreateTicketMessageRequest:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 10000
    AssignTicketRequest:
      type: object
      additionalProperties: false
      required:
      - assignedUserId
      properties:
        assignedUserId:
          type: string
          format: uuid
    Ticket:
      type: object
      required:
      - id
      - customerId
      - subject
      - status
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        subject:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - IN_PROGRESS
          - WAITING_CUSTOMER
          - RESOLVED
          - CLOSED
        assignedUserId:
          type:
          - string
          - 'null'
          format: uuid
    TicketMessage:
      type: object
      required:
      - id
      - ticketId
      - senderUserId
      - message
      - sentAt
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        senderUserId:
          type: string
          format: uuid
        message:
          type: string
        sentAt:
          type: string
          format: date-time
    DeviceRequestStatus:
      type: string
      enum:
      - PENDING
      - FULFILLED
      - CANCELLED
    SubmitDeviceRequest:
      type: object
      additionalProperties: false
      properties:
        notes:
          type: string
          maxLength: 1000
    FulfillDeviceRequest:
      type: object
      additionalProperties: false
      required:
      - deviceId
      properties:
        deviceId:
          type: string
          format: uuid
          description: Eligible Device supplied and associated to the requesting Customer.
    CancelDeviceRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    DeviceRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - customerId
      - status
      - fulfilledDeviceId
      - cancellationReason
      - fulfilledAt
      - cancelledAt
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DeviceRequestStatus'
        notes:
          type:
          - string
          - 'null'
        fulfilledDeviceId:
          type:
          - string
          - 'null'
          format: uuid
        cancellationReason:
          type:
          - string
          - 'null'
        fulfilledAt:
          type:
