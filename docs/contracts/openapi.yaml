openapi: 3.1.0
info:
  title: SecureDelivery API
  version: 1.0.0
  description: >
    Canonical HTTP contract for SecureDelivery. Device is the technical
    domain term. SmartBox is a product-facing UI label only.
servers:
  - url: /api/v1

tags:
  - name: Auth
  - name: Users
  - name: Customers
  - name: Devices
  - name: Monitoring
  - name: Telemetry
  - name: Events
  - name: Tickets

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Refresh an authenticated session
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      responses:
        '204':
          description: Logged out

  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get current user profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: Update current user profile/preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                theme:
                  $ref: '#/components/schemas/Theme'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/me/change-password:
    post:
      tags: [Users]
      operationId: changeOwnPassword
      summary: Change current user's password
      responses:
        '204':
          description: Password changed

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users according to RBAC
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user according to RBAC
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags: [Users]
      operationId: updateUser
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{userId}/activate:
    post:
      tags: [Users]
      operationId: activateUser
      responses:
        '204':
          description: User activated

  /users/{userId}/deactivate:
    post:
      tags: [Users]
      operationId: deactivateUser
      responses:
        '204':
          description: User deactivated

  /users/{userId}/reset-password:
    post:
      tags: [Users]
      operationId: resetUserPassword
      responses:
        '204':
          description: Password reset initiated/completed according to policy

  /users/{userId}/change-role:
    post:
      tags: [Users]
      operationId: changeUserRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/UserRole'
      responses:
        '200':
          description: User role changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomers'
    post:
      tags: [Customers]
      operationId: createCustomer
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Customers]
      operationId: getCustomer
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
    patch:
      tags: [Customers]
      operationId: updateCustomer
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List Devices (displayed as SmartBoxes in product UI)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DeviceStatus'
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDevices'
    post:
      tags: [Devices]
      operationId: createDevice
      summary: Create a Device
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'

  /devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getDevice
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
    patch:
      tags: [Devices]
      operationId: updateDevice
      responses:
        '200':
          description: Device updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
    delete:
      tags: [Devices]
      operationId: removeDevice
      summary: Remove a Device from active operation while preserving required history
      responses:
        '204':
          description: Device removed/deactivated according to retention policy

  /device-activations/{token}:
    get:
      tags: [Devices]
      operationId: validateDeviceActivation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activation information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActivation'

  /device-activations/{token}/confirm:
    post:
      tags: [Devices]
      operationId: confirmDeviceActivation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activated Device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'

  /devices/{deviceId}/monitoring-sessions:
    post:
      tags: [Monitoring]
      operationId: startMonitoringSession
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMonitoringSessionRequest'
      responses:
        '201':
          description: Monitoring session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringSession'

  /devices/{deviceId}/monitoring-sessions/{sessionId}/stop:
    post:
      tags: [Monitoring]
      operationId: stopMonitoringSession
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Monitoring session stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringSession'

  /devices/{deviceId}/telemetry/batches:
    post:
      tags: [Telemetry]
      operationId: ingestTelemetryBatch
      summary: Ingest an idempotent generic telemetry batch
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryBatch'
      responses:
        '202':
          description: Batch accepted or previously accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionAcknowledgement'
        '400':
          $ref: '#/components/responses/BadRequest'

  /devices/{deviceId}/events:
    post:
      tags: [Events]
      operationId: ingestDeviceEvent
      summary: Ingest an idempotent extensible Device-generated event
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEvent'
      responses:
        '202':
          description: Event accepted or previously accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionAcknowledgement'

  /events:
    get:
      tags: [Events]
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: deviceId
          in: query
          schema:
            type: string
            format: uuid
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: eventType
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/EventSeverity'
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvents'

  /events/{eventId}:
    get:
      tags: [Events]
      operationId: getEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEvent'

  /tickets:
    get:
      tags: [Tickets]
      operationId: listTickets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'
    post:
      tags: [Tickets]
      operationId: createTicket
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

  /tickets/{ticketId}:
    get:
      tags: [Tickets]
      operationId: getTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

  /tickets/{ticketId}/messages:
    post:
      tags: [Tickets]
      operationId: createTicketMessage
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '201':
          description: Message persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketMessage'

  /tickets/{ticketId}/assign:
    post:
      tags: [Tickets]
      operationId: assignTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

  /tickets/{ticketId}/resolve:
    post:
      tags: [Tickets]
      operationId: resolveTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    UserRole:
      type: string
      enum: [SUPER_ADMIN, ADMIN, CUSTOMER]

    Theme:
      type: string
      enum: [LIGHT, DARK, SYSTEM]

    DeviceStatus:
      type: string
      enum: [PENDING_ACTIVATION, ACTIVE, INACTIVE]

    DeviceHealth:
      type: string
      enum: [HEALTHY, WARNING, CRITICAL, UNKNOWN]

    ConnectivityStatus:
      type: string
      enum: [ONLINE, OFFLINE, UNKNOWN]

    MonitoringStatus:
      type: string
      enum: [MONITORING, STOPPED, UNKNOWN]

    EventSeverity:
      type: string
      enum: [INFO, WARNING, CRITICAL]

    IngestionStatus:
      type: string
      enum: [ACCEPTED, ALREADY_ACCEPTED, REJECTED]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthSession:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, name, email, role, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        theme:
          $ref: '#/components/schemas/Theme'

    Customer:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          minimum: 0
        recordedAt:
          type: string
          format: date-time

    BatteryState:
      type: object
      required: [levelPercent]
      properties:
        levelPercent:
          type: number
          minimum: 0
          maximum: 100
        charging:
          type: boolean

    ConnectivityState:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ConnectivityStatus'
        type:
          type: string
          description: Extensible connection type such as CELLULAR, WIFI or UNKNOWN.

    DeviceState:
      type: object
      properties:
        battery:
          $ref: '#/components/schemas/BatteryState'
        connectivity:
          $ref: '#/components/schemas/ConnectivityState'
        monitoringStatus:
          $ref: '#/components/schemas/MonitoringStatus'

    Device:
      type: object
      required: [id, code, displayName, status, health]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        displayName:
          type: string
          description: Product-facing name; the UI may label the Device as a SmartBox.
        customerId:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/DeviceStatus'
        health:
          $ref: '#/components/schemas/DeviceHealth'
        monitoringStatus:
          $ref: '#/components/schemas/MonitoringStatus'
        battery:
          $ref: '#/components/schemas/BatteryState'
        connectivity:
          $ref: '#/components/schemas/ConnectivityState'
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        lastLocation:
          anyOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'

    DeviceActivation:
      type: object
      required: [deviceId, status]
      properties:
        deviceId:
          type: string
          format: uuid
        deviceCode:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [VALID, EXPIRED, ALREADY_ACTIVATED, INVALID]

    StartMonitoringSessionRequest:
      type: object
      required: [clientSessionId, startedAt]
      properties:
        clientSessionId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time

    MonitoringSession:
      type: object
      required: [id, deviceId, status, startedAt]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, STOPPED]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time

    Observation:
      type: object
      required: [key, value]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: '^[a-z0-9]+(?:[._-][a-z0-9]+)+$'
        value:
          oneOf:
            - type: number
            - type: string
            - type: boolean
        unit:
          type: string

    TelemetrySample:
      type: object
      required: [sequence, sampledAt, observations]
      properties:
        sequence:
          type: integer
          minimum: 0
        sampledAt:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/Location'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/Observation'

    TelemetryBatch:
      type: object
      required:
        [schemaVersion, batchId, monitoringSessionId, startedAt, finishedAt, samples]
      properties:
        schemaVersion:
          type: integer
          minimum: 1
        batchId:
          type: string
          format: uuid
        monitoringSessionId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        deviceState:
          $ref: '#/components/schemas/DeviceState'
        samples:
          type: array
          items:
            $ref: '#/components/schemas/TelemetrySample'

    Detector:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string

    EventEvidence:
      type: object
      required: [startedAt, finishedAt, samples]
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        samples:
          type: array
          items:
            $ref: '#/components/schemas/TelemetrySample'

    DeviceEvent:
      type: object
      required:
        [schemaVersion, eventId, monitoringSessionId, eventType, severity, occurredAt, detector]
      properties:
        schemaVersion:
          type: integer
          minimum: 1
        eventId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
          readOnly: true
        monitoringSessionId:
          type: string
          format: uuid
        eventType:
          type: string
          description: Open namespaced Device-generated event type.
          pattern: '^[a-z0-9]+(?:[._-][a-z0-9]+)+$'
        severity:
          $ref: '#/components/schemas/EventSeverity'
        occurredAt:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/Location'
        detector:
          $ref: '#/components/schemas/Detector'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        evidence:
          $ref: '#/components/schemas/EventEvidence'

    IngestionAcknowledgement:
      type: object
      required: [id, status, receivedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/IngestionStatus'
        receivedAt:
          type: string
          format: date-time

    Ticket:
      type: object
      required: [id, customerId, subject, status]
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        subject:
          type: string
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, WAITING_CUSTOMER, RESOLVED, CLOSED]
        assignedUserId:
          type: [string, 'null']
          format: uuid

    TicketMessage:
      type: object
      required: [id, ticketId, senderUserId, message, sentAt]
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        senderUserId:
          type: string
          format: uuid
        message:
          type: string
        sentAt:
          type: string
          format: date-time

    Pagination:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: {type: integer}
        pageSize: {type: integer}
        totalItems: {type: integer}
        totalPages: {type: integer}

    PaginatedUsers:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/User'}
        pagination: {$ref: '#/components/schemas/Pagination'}

    PaginatedCustomers:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Customer'}
        pagination: {$ref: '#/components/schemas/Pagination'}

    PaginatedDevices:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Device'}
        pagination: {$ref: '#/components/schemas/Pagination'}

    PaginatedEvents:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DeviceEvent'}
        pagination: {$ref: '#/components/schemas/Pagination'}

    PaginatedTickets:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Ticket'}
        pagination: {$ref: '#/components/schemas/Pagination'}

    ErrorResponse:
      type: object
      required: [statusCode, code, message, requestId, timestamp]
      properties:
        statusCode:
          type: integer
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
