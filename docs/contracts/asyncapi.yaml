asyncapi: 2.6.0
id: urn:securedelivery:realtime:v1
defaultContentType: application/json
info:
  title: SecureDelivery Realtime API
  version: 1.2.0
  contact:
    name: SecureDelivery maintainers
    url: https://github.com/awesomeprojectsss/securedelivery-main
  license:
    name: GNU General Public License v3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
  description: 'Canonical realtime contract. WebSocket messages are realtime signals; authoritative persistent state
    remains available through the HTTP API.

    '
tags:
- name: Devices
  description: Authorized Device operational signals.
- name: Events
  description: Authorized Device-event signals.
- name: Tickets
  description: Authorized support-ticket signals.
- name: Notifications
  description: Authorized persisted-notification signals.
servers:
  local:
    url: ws://localhost:3000
    protocol: ws
    security:
    - UserBearerAuth: []
    description: Development endpoint. Connections authenticate a human user and subscriptions are filtered by RBAC and Customer ownership.
channels:
  device.status.changed:
    subscribe:
      operationId: receiveDeviceStatusChanged
      message:
        $ref: '#/components/messages/DeviceStatusChanged'
  device.health.changed:
    subscribe:
      operationId: receiveDeviceHealthChanged
      message:
        $ref: '#/components/messages/DeviceHealthChanged'
  event.created:
    subscribe:
      operationId: receiveEventCreated
      message:
        $ref: '#/components/messages/EventCreated'
  ticket.updated:
    subscribe:
      operationId: receiveTicketUpdated
      message:
        $ref: '#/components/messages/TicketUpdated'
  ticket.message.created:
    subscribe:
      operationId: receiveTicketMessageCreated
      message:
        $ref: '#/components/messages/TicketMessageCreated'
  notification.created:
    subscribe:
      operationId: receiveNotificationCreated
      message:
        $ref: '#/components/messages/NotificationCreated'
components:
  securitySchemes:
    UserBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Human user access token. The Server authorizes each connection and emitted tenant resource.
  messages:
    DeviceStatusChanged:
      name: device.status.changed
      messageId: deviceStatusChanged
      payload:
        type: object
        required:
        - type
        - occurredAt
        - data
        properties:
          type:
            const: device.status.changed
          occurredAt:
            type: string
            format: date-time
          data:
            type: object
            required:
            - deviceId
            - status
            properties:
              deviceId:
                type: string
                format: uuid
              status:
                type: string
                enum:
                - PENDING_ACTIVATION
                - ACTIVE
                - INACTIVE
              connectivityStatus:
                type: string
                enum:
                - ONLINE
                - OFFLINE
                - UNKNOWN
              monitoringStatus:
                type: string
                enum:
                - MONITORING
                - STOPPED
                - UNKNOWN
              batteryLevelPercent:
                type: number
    DeviceHealthChanged:
      name: device.health.changed
      messageId: deviceHealthChanged
      payload:
        type: object
        required:
        - type
        - occurredAt
        - data
        properties:
          type:
            const: device.health.changed
          occurredAt:
            type: string
            format: date-time
          data:
            type: object
            required:
            - deviceId
            - health
            properties:
              deviceId:
                type: string
                format: uuid
              health:
                type: string
                enum:
                - HEALTHY
                - WARNING
                - CRITICAL
                - UNKNOWN
    EventCreated:
      name: event.created
      messageId: eventCreated
      payload:
        type: object
        required:
        - type
        - occurredAt
        - data
        properties:
          type:
            const: event.created
          occurredAt:
            type: string
            format: date-time
          data:
            type: object
            required:
            - eventId
            - deviceId
            - eventType
            - severity
            properties:
              eventId:
                type: string
                format: uuid
              deviceId:
                type: string
                format: uuid
              eventType:
                type: string
              severity:
                type: string
                enum:
                - INFO
                - WARNING
                - CRITICAL
    TicketUpdated:
      name: ticket.updated
      messageId: ticketUpdated
      payload:
        type: object
        required:
        - type
        - occurredAt
        - data
        properties:
          type:
            const: ticket.updated
          occurredAt:
            type: string
            format: date-time
          data:
            type: object
            required:
            - ticketId
            - status
            properties:
              ticketId:
                type: string
                format: uuid
              status:
                type: string
                enum:
                - OPEN
                - IN_PROGRESS
                - WAITING_CUSTOMER
                - RESOLVED
                - CLOSED
              assignedUserId:
                type:
                - string
                - 'null'
    TicketMessageCreated:
      name: ticket.message.created
      messageId: ticketMessageCreated
      payload:
        type: object
        required:
        - type
        - occurredAt
        - data
        properties:
          type:
            const: ticket.message.created
          occurredAt:
            type: string
            format: date-time
          data:
            type: object
            required:
            - ticketId
            - messageId
            - senderUserId
            properties:
              ticketId:
                type: string
                format: uuid
              messageId:
                type: string
                format: uuid
              senderUserId:
                type: string
                format: uuid
    NotificationCreated:
      name: notification.created
      messageId: notificationCreated
      payload:
        type: object
        required:
        - type
        - occurredAt
        - data
        properties:
          type:
            const: notification.created
          occurredAt:
            type: string
            format: date-time
          data:
            type: object
            required:
            - notificationId
            properties:
              notificationId:
                type: string
                format: uuid
              code:
                type: string
