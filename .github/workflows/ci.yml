name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Contracts and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the workspace
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install pinned validation tools
        run: npm ci

      - name: Run the same checks used locally
        run: npm run ci
